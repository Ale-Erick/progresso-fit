{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ProgressoFit{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=7">
</head>
<body>
    {% block header %}{% include 'includes/header.html' %}{% endblock %}

    <main class="container py-4 py-lg-5">
        {% for mensagem in messages %}
            <div class="alert pf-alert {% if mensagem.tags == 'error' %}pf-alert-erro{% elif mensagem.tags == 'info' %}pf-alert-info{% else %}pf-alert-sucesso{% endif %} alert-dismissible fade show" role="alert">
                <i class="bi {% if mensagem.tags == 'error' %}bi-exclamation-circle{% elif mensagem.tags == 'info' %}bi-info-circle{% else %}bi-check-circle{% endif %} me-1"></i> {{ mensagem }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}?v=6"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
